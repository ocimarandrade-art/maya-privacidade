<h1>Maya</h1>
<p>A Maya é um assistente pessoal de uso privado, executado no computador do próprio usuário. Ela ajuda a organizar a agenda, os e-mails, lembretes, tarefas e documentos.</p>
<p>Não é um serviço aberto ao público e não há cadastro de novos usuários.</p>
